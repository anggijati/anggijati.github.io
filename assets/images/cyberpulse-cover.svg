<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101a"/>
      <stop offset="100%" stop-color="#0e1f33"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38a8e8"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#hudBg)"/>

  <!-- Cockpit Grid Backdrop -->
  <g stroke="rgba(56, 168, 232, 0.08)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
  </g>

  <!-- Cockpit HUD Panels -->
  <!-- Center Scope -->
  <circle cx="400" cy="240" r="120" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" fill="none"/>
  <circle cx="400" cy="240" r="75" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1.5" fill="none"/>
  <line x1="280" y1="240" x2="520" y2="240" stroke="rgba(0, 240, 255, 0.2)"/>
  <line x1="400" y1="120" x2="400" y2="360" stroke="rgba(0, 240, 255, 0.2)"/>

  <!-- Oscilloscope Waveform -->
  <path d="M 120 280 Q 200 180, 280 260 T 400 230 T 520 180 T 640 260 T 720 220" fill="none" stroke="url(#waveGrad)" stroke-width="3.5"/>

  <!-- Top Banner -->
  <rect x="250" y="40" width="300" height="34" rx="17" fill="rgba(14, 31, 51, 0.9)" stroke="rgba(0, 240, 255, 0.3)"/>
  <text x="400" y="61" text-anchor="middle" fill="#00f0ff" font-family="Inter, sans-serif" font-size="11" font-weight="800">CYBERPULSE // 60 FPS WEBGL HUD</text>

  <!-- Floating Telemetry Pills -->
  <rect x="150" y="380" width="140" height="42" rx="8" fill="#132135" stroke="rgba(255,255,255,0.1)"/>
  <text x="165" y="406" fill="#f8fafc" font-family="Inter, sans-serif" font-size="12" font-weight="800">FPS: 60.0 NOM</text>

  <rect x="510" y="380" width="150" height="42" rx="8" fill="#132135" stroke="rgba(255,255,255,0.1)"/>
  <text x="525" y="406" fill="#00ff9d" font-family="Inter, sans-serif" font-size="12" font-weight="800">LATENCY: 1.2ms</text>
</svg>
