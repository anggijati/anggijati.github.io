<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="betaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#betaBg)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Central Glow -->
  <circle cx="400" cy="240" r="140" fill="rgba(129, 140, 248, 0.15)" filter="blur(40px)"/>

  <!-- Window Frame -->
  <rect x="140" y="80" width="520" height="340" rx="18" fill="#0f172a" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.5"/>

  <!-- Header -->
  <path d="M 140 98 A 18 18 0 0 1 158 80 L 642 80 A 18 18 0 0 1 660 98 L 660 120 L 140 120 Z" fill="#1e293b"/>
  <circle cx="168" cy="100" r="5" fill="#fb7185"/>
  <circle cx="186" cy="100" r="5" fill="#facc15"/>
  <circle cx="204" cy="100" r="5" fill="#34d399"/>
  <text x="226" y="104" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="700">PROJECT BETA // Digital Service Platform</text>

  <!-- Big Stylized P Badge -->
  <circle cx="400" cy="235" r="50" fill="rgba(129, 140, 248, 0.12)" stroke="url(#purpleGrad)" stroke-width="4"/>
  <text x="400" y="252" text-anchor="middle" fill="#c084fc" font-family="Inter, sans-serif" font-size="46" font-weight="900">P</text>

  <text x="400" y="325" text-anchor="middle" fill="#f8fafc" font-family="Inter, sans-serif" font-size="18" font-weight="800">Project Beta</text>
  <text x="400" y="348" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Fast, Accessible &amp; Responsive Digital Experience</text>

  <!-- Top Banner -->
  <rect x="250" y="38" width="300" height="34" rx="17" fill="rgba(30, 27, 75, 0.95)" stroke="rgba(129, 140, 248, 0.35)"/>
  <text x="400" y="59" text-anchor="middle" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="11" font-weight="800">DIGITAL SERVICE PLATFORM</text>
</svg>
