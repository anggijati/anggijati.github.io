<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="iotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07121e"/>
      <stop offset="100%" stop-color="#0a1e2f"/>
    </linearGradient>
    <linearGradient id="sensorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#iotBg)"/>

  <!-- Radar Circles -->
  <circle cx="400" cy="250" r="80" stroke="rgba(0, 255, 157, 0.15)" stroke-width="1.5" fill="none"/>
  <circle cx="400" cy="250" r="150" stroke="rgba(0, 255, 157, 0.1)" stroke-width="1.5" fill="none"/>
  <circle cx="400" cy="250" r="220" stroke="rgba(0, 255, 157, 0.05)" stroke-width="1.5" fill="none"/>

  <!-- Network Circuit Lines -->
  <g stroke="rgba(56, 168, 232, 0.3)" stroke-width="1.5" stroke-dasharray="4,4">
    <line x1="400" y1="250" x2="250" y2="160"/>
    <line x1="400" y1="250" x2="550" y2="170"/>
    <line x1="400" y1="250" x2="280" y2="340"/>
    <line x1="400" y1="250" x2="520" y2="330"/>
    <line x1="250" y1="160" x2="160" y2="240"/>
    <line x1="550" y1="170" x2="650" y2="260"/>
  </g>

  <!-- Central Gateway Node -->
  <circle cx="400" cy="250" r="36" fill="#0f2b3e" stroke="#00ff9d" stroke-width="2.5"/>
  <text x="400" y="255" text-anchor="middle" font-size="22">📡</text>
  <text x="400" y="302" text-anchor="middle" fill="#00ff9d" font-family="Inter, sans-serif" font-size="12" font-weight="800">EDGE GATEWAY</text>

  <!-- Node 1 -->
  <circle cx="250" cy="160" r="24" fill="#0f2b3e" stroke="#38a8e8" stroke-width="2"/>
  <text x="250" y="165" text-anchor="middle" font-size="14">🛰️</text>
  <text x="250" y="196" text-anchor="middle" fill="#8aa0b7" font-family="Inter, sans-serif" font-size="10" font-weight="700">ESP32-NODE-01</text>
  <text x="250" y="210" text-anchor="middle" fill="#38a8e8" font-family="Inter, sans-serif" font-size="9">24.2°C / 62% RH</text>

  <!-- Node 2 -->
  <circle cx="550" cy="170" r="24" fill="#0f2b3e" stroke="#38a8e8" stroke-width="2"/>
  <text x="550" y="175" text-anchor="middle" font-size="14">🛰️</text>
  <text x="550" y="206" text-anchor="middle" fill="#8aa0b7" font-family="Inter, sans-serif" font-size="10" font-weight="700">ESP32-NODE-02</text>
  <text x="550" y="220" text-anchor="middle" fill="#38a8e8" font-family="Inter, sans-serif" font-size="9">128 Vibration G</text>

  <!-- Node 3 -->
  <circle cx="280" cy="340" r="22" fill="#0f2b3e" stroke="#38a8e8" stroke-width="2"/>
  <text x="280" y="345" text-anchor="middle" font-size="13">⚡</text>
  <text x="280" y="375" text-anchor="middle" fill="#8aa0b7" font-family="Inter, sans-serif" font-size="10" font-weight="700">POWER-MONITOR</text>

  <!-- Node 4 -->
  <circle cx="520" cy="330" r="22" fill="#0f2b3e" stroke="#38a8e8" stroke-width="2"/>
  <text x="520" y="335" text-anchor="middle" font-size="13">🔋</text>
  <text x="520" y="365" text-anchor="middle" fill="#8aa0b7" font-family="Inter, sans-serif" font-size="10" font-weight="700">LORA-RELAY</text>

  <!-- Telemetry Badge Top -->
  <rect x="260" y="45" width="280" height="34" rx="17" fill="rgba(15, 43, 62, 0.8)" stroke="rgba(0, 255, 157, 0.3)"/>
  <circle cx="280" cy="62" r="5" fill="#00ff9d"/>
  <text x="296" y="66" fill="#f8fafc" font-family="Inter, sans-serif" font-size="11" font-weight="800">AEGIS SENTINEL // MQTT MESH ACTIVE</text>
</svg>
