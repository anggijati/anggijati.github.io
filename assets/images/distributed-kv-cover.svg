<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#161c33"/>
    </linearGradient>
    <linearGradient id="raftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38a8e8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#kvBg)"/>

  <!-- Consensus Rings -->
  <g stroke="rgba(0, 240, 255, 0.15)" stroke-width="1.5" fill="none">
    <circle cx="400" cy="240" r="130"/>
    <circle cx="400" cy="240" r="180"/>
  </g>

  <!-- Raft Triad -->
  <!-- Leader Node -->
  <g transform="translate(400, 130)">
    <rect x="-85" y="-35" width="170" height="70" rx="12" fill="#182238" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="-55" cy="0" r="14" fill="rgba(0,240,255,0.2)"/>
    <text x="-55" y="5" text-anchor="middle" font-size="14">👑</text>
    <text x="-30" y="-8" fill="#00f0ff" font-family="Inter, sans-serif" font-size="10" font-weight="900">RAFT LEADER</text>
    <text x="-30" y="10" fill="#f8fafc" font-family="Inter, sans-serif" font-size="12" font-weight="800">Node-Alpha</text>
    <text x="-30" y="24" fill="#8aa0b7" font-family="Inter, sans-serif" font-size="9">Term: 14 | QPS: 48k</text>
  </g>

  <!-- Follower Node 1 -->
  <g transform="translate(250, 310)">
    <rect x="-80" y="-35" width="160" height="70" rx="12" fill="#182238" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1.5"/>
    <circle cx="-50" cy="0" r="14" fill="rgba(255,255,255,0.05)"/>
    <text x="-50" y="5" text-anchor="middle" font-size="13">⚡</text>
    <text x="-26" y="-8" fill="#8aa0b7" font-family="Inter, sans-serif" font-size="10" font-weight="800">FOLLOWER</text>
    <text x="-26" y="10" fill="#f8fafc" font-family="Inter, sans-serif" font-size="12" font-weight="800">Node-Beta</text>
    <text x="-26" y="24" fill="#34d399" font-family="Inter, sans-serif" font-size="9">Log Synced [OK]</text>
  </g>

  <!-- Follower Node 2 -->
  <g transform="translate(550, 310)">
    <rect x="-80" y="-35" width="160" height="70" rx="12" fill="#182238" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1.5"/>
    <circle cx="-50" cy="0" r="14" fill="rgba(255,255,255,0.05)"/>
    <text x="-50" y="5" text-anchor="middle" font-size="13">⚡</text>
    <text x="-26" y="-8" fill="#8aa0b7" font-family="Inter, sans-serif" font-size="10" font-weight="800">FOLLOWER</text>
    <text x="-26" y="10" fill="#f8fafc" font-family="Inter, sans-serif" font-size="12" font-weight="800">Node-Gamma</text>
    <text x="-26" y="24" fill="#34d399" font-family="Inter, sans-serif" font-size="9">Log Synced [OK]</text>
  </g>

  <!-- Heartbeat Lines -->
  <path d="M 330 150 L 250 270" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="5,5"/>
  <path d="M 470 150 L 550 270" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="5,5"/>
  <path d="M 330 310 L 470 310" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Badge -->
  <rect x="260" y="38" width="280" height="34" rx="17" fill="rgba(24, 34, 56, 0.9)" stroke="rgba(0, 240, 255, 0.3)"/>
  <text x="400" y="59" text-anchor="middle" fill="#00f0ff" font-family="Inter, sans-serif" font-size="11" font-weight="800">VORTEX-KV // RAFT CONSENSUS ENGINE</text>
